<!DOCTYPE html>
<html>
<head>
    <title>Print QR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .label {
            border: 2px dashed #333;
            padding: 20px;
            width: 250px;
            display: inline-block;
        }

        img {
            max-width: 200px;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .id {
            font-size: 14px;
            color: #555;
        }

        @media print {
            body {
                margin: 0;
            }

            .label {
                border: none;
            }
        }
    </style>
</head>

<body onload="window.print()">

    <div class="label">
        <img src="/qr/{{ item.item_id }}">
        <div class="name">{{ item.item_name }}</div>
        <div class="id">#{{ item.item_id }}</div>
    </div>

</body>
</html>
