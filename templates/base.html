<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SnekSort Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Bootstrap Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    
</head>

<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand mb-0 h5" href="{{ url_for('dashboard') }}">SnekSort Inventory 🐍</a>

        <div class="d-flex align-items-center gap-3">
            {% if current_user.is_authenticated %}
                <div class="text-white d-flex align-items-center gap-2">
                    <span class="small text-muted">{{ current_user.role | capitalize }}</span>
                    <span class="fw-bold">{{ current_user.username }}</span>
                    <i class="bi bi-person-circle fs-5"></i>
                </div>
                
                <div class="vr bg-secondary mx-2" style="height: 20px;"></div> <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">
                    Logout
                </a>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
