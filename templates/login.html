{% extends "base.html" %}
{% block content %}
<div class="container login-container">
    <div class="card login-card">
        <div class="card-body login-card-body">
            <header class="text-center mb-4">
                <h2 class="login-brand-header text-primary">SnekSort</h2>
                <p class="text-muted small">Login</p>
            </header>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label-custom">Username</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control input-field-custom" 
                           placeholder="Enter username" 
                           required 
                           autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label-custom">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control input-field-custom" 
                           placeholder="Enter password"
                           required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 btn-login-submit">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
